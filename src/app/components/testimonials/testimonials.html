<section class="testimonials">
    <div class="content_wrapper">
        <div class="testimonials_wrapper">
            <h2>What my colleagues say about me</h2>
            <div class="carousel_wrapper">
                <div class="carousel" [class.is-next]="direction === 'next'"
                    [class.is-previous]="direction === 'previous'">

                    @for (testimonial of testimonials; track $index) {
                    <div class="slider" [class.left]="getPosition($index) === 'left'"
                        [class.center]="getPosition($index) === 'center'"
                        [class.right]="getPosition($index) === 'right'" (click)="goTo($index)">
                        <p class="testimonial_text">
                            {{ testimonial.text }}
                        </p>
                        <div class="testimonial_author">
                            <div class="line"></div>
                            <p>{{ testimonial.author }}</p>
                        </div>
                    </div>
                    }
                </div>

                <img class="quote_mark" src="./assets/images/quotes.png" alt="quotes">
                <div class="carousel_buttons">
                    <button class="arrow_button" (click)="previous()" aria-label="Previous testimonial">
                        <img src="./assets/images/arrow_back.png" alt="Previous">
                    </button>
                    <div class="dots">
                        @for (testimonial of testimonials; track $index) {
                        <span class="dot" [class.active]="activeIndex === $index"></span>
                        }
                    </div>
                    <button class="arrow_button" (click)="next()" aria-label="Next testimonial">
                        <img src="./assets/images/arrow_forward.png" alt="Next">
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
